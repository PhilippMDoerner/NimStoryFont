<app-card class="carousel">
  @if (showContextMenu()) {
    <app-context-menu
      class="carousel__actions"
      [menuItems]="contextActions()"
      [menuButtonKind]="'LIGHT-OUTLINE'"
      [menuButtonIcon]="'ellipsis-vertical'"
      [menuButtonText]="'Image Action Menu'"
      [menuButtonShowText]="false"
      (actionTriggered)="onContextMenuAction($event)"
    />
  }
  @if (images() && images().length > 0) {
    <ngb-carousel
      #imageCarousel
      [interval]="0"
      [showNavigationArrows]="images().length > 1"
      [showNavigationIndicators]="images().length > 1"
      [activeId]="'imageIndex-' + currentSlideIndex()"
      (slide)="onSlide($event)"
      (slid)="onSlideEnd($event)"
    >
      @for (image of images(); track image.pk) {
        <ng-template ngbSlide [id]="'imageIndex-' + $index">
          <div class="image-container" [ngbTooltip]="image.name">
            <img [src]="serverUrl() + image.image" [alt]="'Image ' + $index" />
          </div>
        </ng-template>
      }
    </ngb-carousel>
  } @else {
    <ng-container *ngTemplateOutlet="defaultImage"></ng-container>
  }
</app-card>

<ng-template #defaultImage>
  <ngb-carousel
    [showNavigationArrows]="false"
    [showNavigationIndicators]="false"
  >
    <ng-template ngbSlide>
      <div class="image-container default-image">
        <img [src]="'assets/default_images/icon_default.webp'" alt="" />
        <div class="image-caption">
          <p>This article doesn't have an image yet</p>
          @if (canCreate()) {
            <button
              btn
              [kind]="'PRIMARY'"
              [icon]="createEntry.icon"
              [text]="'Add first Image'"
              (click)="onImageCreate()"
            ></button>
          }
        </div>
      </div>
    </ng-template>
  </ngb-carousel>
</ng-template>
