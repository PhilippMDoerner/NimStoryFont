<div class="editor-wrapper">
  <!-- Custom toolbar: Quill's snow theme scans this container for ql-* classes -->
  <div ngToolbar #toolbar class="ql-toolbar ql-snow custom-toolbar">
    <!-- [{ header: [1,2,3,4,5,6,false] }] -->
    <!-- TODO: Implement this, not yet sure how to do selects as a toolbarwidget -->
    <!-- <span class="ql-formats">
      <select class="ql-header">
        <option value="1"></option>
        <option value="2"></option>
        <option value="3"></option>
        <option value="4"></option>
        <option value="5"></option>
        <option value="6"></option>
        <option selected></option>
      </select>
    </span> -->

    <!-- 'bold','italic','underline','strike','blockquote', {script:'sub'}, {script:'super'} -->
    <span class="ql-formats">
      <button
        ngToolbarWidget
        value="bold"
        class="ql-bold"
        type="button"
        aria-label="Bold"
        [ngbTooltip]="'Ctrl + b'"
      ></button>
      <button
        ngToolbarWidget
        value="italic"
        class="ql-italic"
        type="button"
        aria-label="Italic"
        [ngbTooltip]="'Ctrl + i'"
      ></button>
      <button
        ngToolbarWidget
        value="underline"
        class="ql-underline"
        type="button"
        aria-label="Underline"
        [ngbTooltip]="'Ctrl + u'"
      ></button>
      <button
        ngToolbarWidget
        value="strike"
        class="ql-strike"
        type="button"
        aria-label="Strike"
      ></button>
      <button
        ngToolbarWidget
        value="blockquote"
        class="ql-blockquote"
        type="button"
        aria-label="Blockquote"
      ></button>
      <button
        class="ql-script"
        ngToolbarWidget
        value="sub"
        type="button"
        aria-label="Subscript"
      ></button>
      <button
        class="ql-script"
        ngToolbarWidget
        value="super"
        type="button"
        aria-label="Superscript"
      ></button>
    </span>

    <!-- { color: [] }, { background: [] } -->
    <!-- TODO: Make selects work here -->
    <!-- <span class="ql-formats">
      <select class="ql-color"></select>
      <select class="ql-background"></select>
    </span> -->

    <!-- 'link','image','video' -->
    <span class="ql-formats">
      <button
        ngToolbarWidget
        value="link"
        class="ql-link"
        type="button"
        aria-label="Link"
        [ngbTooltip]="'Ctrl + k'"
      ></button>
      <button
        ngToolbarWidget
        value="image"
        class="ql-image"
        type="button"
        aria-label="Image"
      ></button>
      <button
        ngToolbarWidget
        value="video"
        class="ql-video"
        type="button"
        aria-label="Video"
      ></button>
    </span>

    <!-- { align:'' }, {align:'center'}, {align:'right'}, {align:'justify'},
         { list:'ordered' }, { list:'bullet' },
         { indent:'-1' }, { indent:'+1' } -->
    <span class="ql-formats">
      <!-- TODO: Make selects work -->
      <!-- <select class="ql-align">
        <option selected></option>
        <option value="center"></option>
        <option value="right"></option>
        <option value="justify"></option>
      </select> -->
      <button
        ngToolbarWidget
        class="ql-list"
        value="ordered"
        type="button"
        aria-label="Ordered list"
      ></button>
      <button
        ngToolbarWidget
        class="ql-list"
        value="bullet"
        type="button"
        aria-label="Bullet list"
      ></button>
      <button
        ngToolbarWidget
        class="ql-indent"
        value="-1"
        type="button"
        aria-label="Outdent"
      ></button>
      <button
        ngToolbarWidget
        class="ql-indent"
        value="+1"
        type="button"
        aria-label="Indent"
      ></button>
    </span>

    <!-- { [TableUp.toolName]: [] } -->
    <span class="ql-formats">
      <!-- Class must be `ql-<TableUp.toolName>` so Quill's toolbar module
           matches it to the format/handler the plugin registers.
           Check the plugin's own docs/demo for whether it expects a
           <select> (picker) or a <button> here — the comment in your
           original config ("use picker to enable the customSelect option")
           suggests a <select>, so that's shown below. -->
      <!-- TODO: Make selects work -->
      <!-- <select class="ql-table-up">
        <option value="new"></option>
      </select> -->
    </span>

    <!-- 'clean' -->
    <span class="ql-formats">
      <button
        ngToolbarWidget
        value="clean"
        class="ql-clean"
        type="button"
        aria-label="Remove formatting"
      ></button>
    </span>
  </div>
  <div class="editor-body" #editor></div>
</div>
