@if (!isLoadingQuote()) {
  <section class="field">
    @let quoteVal = quote();
    @if(hasQuote()){
      @if (quoteVal) {
        <div class="field__quote quote" [attr.aria-label]="quoteLabel()">
          <figure class="m-0">
            <!-- Quote -->
            <blockquote class="quote__content">
              <p [innerHTML]="quoteVal.quote"></p>
            </blockquote>
            <figcaption class="quote__description">
              <!-- Quote Description -->
              @if (quoteVal.description) {
                <p class="m-0" [innerHTML]="'- ' + quoteVal.description"></p>
              } @else {
                - {{ character().name }}
              }
            </figcaption>
          </figure>
          <app-separator />

          <!-- Quote Connections -->
          <div class="quote__connections">
            <app-badge-list
              [entries]="badgeEntries()"
              [label]="'Characters'"
              [createOptions]="{
                kind: 'SELECT',
                formFieldLabel: 'Characters',
                config: {
                  options: campaignCharacters(),
                  labelProp: 'name',
                  valueProp: 'pk',
                },
              }"
              [canCreate]="canCreate()"
              [canDelete]="canDelete()"
              [cancelButtonType]="'DARK'"
              (entryCreate)="onConnectionCreate($event)"
              (entryDelete)="onConnectionDelete($event)"
            ></app-badge-list>
          </div>
        </div>
      }
      @if(showQuoteControls()){
        <app-context-menu
          [menuItems]="shownQuoteControlls()"
          [menuButtonKind]="'LIGHT-OUTLINE'"
          [menuButtonIcon]="'ellipsis-vertical'"
          (actionTriggered)="onContextMenuAction($event)"
        />
      }
    } @else if(!hasQuote() && canCreate()){
      <button
        btn
        class="field__control"
        [kind]="'PRIMARY'"
        [text]="'Add first Quote'"
        [icon]="'plus'"
        (clicked)="quoteCreate.emit()"
      ></button>
    }

  </section>
}

<ng-template #loading>
  <app-spinner></app-spinner>
</ng-template>
