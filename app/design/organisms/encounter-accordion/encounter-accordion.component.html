<div class="encounter-list mb-5 mt-3 gap-3">
  <ng-container *ngTemplateOutlet="pagination" />
  <div ngbAccordion [closeOthers]="true" [animation]="true">

    @for (encounter of displayedEncounters(); track encounter.pk) {
      @let headingId = "encounter-heading-" + $index;
      <div ngbAccordionItem [id]="'static-' + $index">
        <div ngbAccordionHeader [heading]="3" [id]="headingId">
          <button ngbAccordionButton class="panel-title">
            <strong
              class="encounter-title"
              [innerHTML]="encounter.name"
            ></strong>
          </button>
        </div>

        <div ngbAccordionCollapse>
          <div ngbAccordionBody>
            <app-encounter
              class="panel-content"
              [encounter]="encounter"
              [locations]="campaignLocations()"
              [characters]="campaignCharacters()"
              [serverModel]="serverModel()"
              [canUpdate]="canUpdate()"
              [canDelete]="canDelete()"
              [canCreate]="canCreate()"
              [isInFocus]="false"
              [headingId]="headingId"
              [ariaLevel]="4"
              (connectionDelete)="connectionDelete.emit($event)"
              (connectionCreate)="connectionCreate.emit($event)"
              (encounterDelete)="encounterDelete.emit($event)"
              (encounterUpdate)="encounterUpdate.emit($event)"
            ></app-encounter>
          </div>
        </div>
      </div>
    }

  </div>
  <ng-container *ngTemplateOutlet="pagination" />
</div>

<ng-template #pagination>
  @if(displayedEncounters().length > 0){
    <app-pagination
      [collectionSize]="encounters().length"
      [(page)]="page"
      [pageSize]="5"
    />
  }
</ng-template>
